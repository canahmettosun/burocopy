<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Büro Copy – Fiyat Hesaplama</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYgBx5T_7aS6IeV3f-T6KVjzZg6V5kRY0",
  authDomain: "buro-copy-fiyat-listesi.firebaseapp.com",
  projectId: "buro-copy-fiyat-listesi",
  storageBucket: "buro-copy-fiyat-listesi.firebasestorage.app",
  messagingSenderId: "969205548894",
  appId: "1:969205548894:web:7ff904261fb355e85771cf"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let products = {};

async function loadProducts() {
  const snap = await getDocs(collection(db, "products"));
  const select = document.getElementById("product");
  snap.forEach(doc => {
    products[doc.id] = doc.data();
    const opt = document.createElement("option");
    opt.value = doc.id;
    opt.textContent = doc.data().name;
    select.appendChild(opt);
  });
}

window.calculate = function () {
  const p = products[product.value];
  const qty = Number(amount.value);
  if (!p || !qty) return;

  let unitPrice = 0;
  p.tiers.forEach(t => {
    if (qty >= t.min) unitPrice = t.price;
  });

  document.getElementById("unitPrice").innerText = unitPrice;
  document.getElementById("total").innerText = (unitPrice * qty).toFixed(2);
};

window.onload = loadProducts;
</script>
</head>
<body>
<h2>Fiyat Hesaplama</h2>

Ürün:
<select id="product" onchange="calculate()">
  <option value="">Seç</option>
</select><br>

Miktar:
<input id="amount" type="number" oninput="calculate()"><br><br>

Birim Fiyat: <span id="unitPrice">-</span> ₺<br>
Toplam: <span id="total">-</span> ₺
</body>
</html>
