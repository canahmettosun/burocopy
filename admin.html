<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Büro Copy – Yönetim Paneli</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYgBx5T_7aS6IeV3f-T6KVjzZg6V5kRY0",
  authDomain: "buro-copy-fiyat-listesi.firebaseapp.com",
  projectId: "buro-copy-fiyat-listesi",
  storageBucket: "buro-copy-fiyat-listesi.firebasestorage.app",
  messagingSenderId: "969205548894",
  appId: "1:969205548894:web:7ff904261fb355e85771cf"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.saveProduct = async function () {
  const code = document.getElementById("code").value;
  const name = document.getElementById("name").value;
  const unit = document.getElementById("unit").value;

  const tiers = [];
  document.querySelectorAll(".tier").forEach(row => {
    const min = Number(row.querySelector(".min").value);
    const price = Number(row.querySelector(".price").value);
    if (min && price) tiers.push({ min, price });
  });

  await setDoc(doc(db, "products", code), {
    name,
    unit,
    tiers
  });

  alert("Ürün kaydedildi");
};

window.addTier = function () {
  const div = document.createElement("div");
  div.className = "tier";
  div.innerHTML = `
    Min: <input class="min" type="number">
    Fiyat: <input class="price" type="number" step="0.01">
  `;
  document.getElementById("tiers").appendChild(div);
};
</script>
</head>
<body>
<h2>Yönetim Paneli</h2>

Ürün Kodu: <input id="code"><br>
Ürün Adı: <input id="name"><br>
Birim:
<select id="unit">
  <option value="adet">Adet</option>
  <option value="m">Metre</option>
  <option value="m2">m²</option>
</select>

<h3>Fiyat Kademeleri</h3>
<div id="tiers"></div>
<button onclick="addTier()">+ Kademe Ekle</button><br><br>

<button onclick="saveProduct()">Kaydet</button>
</body>
</html>
