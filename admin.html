<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Büro Copy – Yönetim Paneli</title>
<!-- Font Awesome ikonları -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYgBx5T_7aS6IeV3f-T6KVjzZg6V5kRY0",
  authDomain: "buro-copy-fiyat-listesi.firebaseapp.com",
  projectId: "buro-copy-fiyat-listesi",
  storageBucket: "buro-copy-fiyat-listesi.firebasestorage.app",
  messagingSenderId: "969205548894",
  appId: "1:969205548894:web:7ff904261fb355e85771cf"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.saveProduct = async function () {
  const code = document.getElementById("code").value;
  const name = document.getElementById("name").value;
  const unit = document.getElementById("unit").value;

  // Form doğrulama
  if (!code || !name || !unit) {
    showNotification("Lütfen tüm zorunlu alanları doldurun!", "error");
    return;
  }

  const tiers = [];
  const tierElements = document.querySelectorAll(".tier");
  
  // En az bir kademe olmalı
  if (tierElements.length === 0) {
    showNotification("En az bir fiyat kademesi ekleyin!", "error");
    return;
  }
  
  let isValid = true;
  
  tierElements.forEach((row, index) => {
    const min = Number(row.querySelector(".min").value);
    const price = Number(row.querySelector(".price").value);
    
    if (min && price) {
      // Kademelerin sıralı olduğundan emin ol
      if (index > 0) {
        const prevMin = Number(tierElements[index-1].querySelector(".min").value);
        if (min <= prevMin) {
          showNotification(`Kademe ${index+1}: Min değer önceki kademeden büyük olmalı!`, "error");
          isValid = false;
        }
      }
      tiers.push({ min, price });
    } else {
      showNotification(`Kademe ${index+1}: Min ve Fiyat alanları doldurulmalı!`, "error");
      isValid = false;
    }
  });
  
  if (!isValid) return;

  try {
    await setDoc(doc(db, "products", code), {
      name,
      unit,
      tiers,
      lastUpdated: new Date().toISOString()
    });
    
    showNotification("Ürün başarıyla kaydedildi!", "success");
    
    // Formu temizle
    document.getElementById("code").value = "";
    document.getElementById("name").value = "";
    document.getElementById("unit").value = "adet";
    document.getElementById("tiers").innerHTML = "";
    
    // Başlangıç kademesini ekle
    addTier();
    
  } catch (error) {
    console.error("Kaydetme hatası:", error);
    showNotification("Kayıt sırasında bir hata oluştu!", "error");
  }
};

window.addTier = function () {
  const div = document.createElement("div");
  div.className = "tier";
  div.innerHTML = `
    <div class="tier-header">
      <span class="tier-number">Kademe ${document.querySelectorAll(".tier").length + 1}</span>
      <button type="button" class="btn-remove-tier" onclick="removeTier(this)">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="tier-inputs">
      <div class="input-group">
        <label for="min_${Date.now()}"><i class="fas fa-layer-group"></i> Min. Adet:</label>
        <input class="min" type="number" min="1" id="min_${Date.now()}" placeholder="Minimum miktar" required>
      </div>
      <div class="input-group">
        <label for="price_${Date.now()}"><i class="fas fa-tag"></i> Fiyat (₺):</label>
        <input class="price" type="number" step="0.01" min="0.01" id="price_${Date.now()}" placeholder="Birim fiyat" required>
      </div>
    </div>
  `;
  document.getElementById("tiers").appendChild(div);
  
  // Kademe numaralarını güncelle
  updateTierNumbers();
};

window.removeTier = function (button) {
  const tier = button.closest(".tier");
  tier.remove();
  updateTierNumbers();
};

function updateTierNumbers() {
  document.querySelectorAll(".tier").forEach((tier, index) => {
    tier.querySelector(".tier-number").textContent = `Kademe ${index + 1}`;
  });
}

function showNotification(message, type) {
  // Mevcut bildirimleri temizle
  const existingNotifications = document.querySelectorAll(".notification");
  existingNotifications.forEach(notification => {
    notification.remove();
  });
  
  const notification = document.createElement("div");
  notification.className = `notification notification-${type}`;
  notification.innerHTML = `
    <div class="notification-content">
      <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
      <span>${message}</span>
    </div>
    <button class="notification-close" onclick="this.parentElement.remove()">
      <i class="fas fa-times"></i>
    </button>
  `;
  
  document.body.appendChild(notification);
  
  // 5 saniye sonra bildirimi kaldır
  setTimeout(() => {
    if (notification.parentNode) {
      notification.remove();
    }
  }, 5000);
}
</script>
<style>
/* Genel Stiller */
:root {
  --primary-color: #3498db;
  --primary-dark: #2980b9;
  --secondary-color: #2ecc71;
  --secondary-dark: #27ae60;
  --dark-bg: #121212;
  --darker-bg: #0a0a0a;
  --card-bg: #1e1e1e;
  --card-hover: #252525;
  --text-primary: #ffffff;
  --text-secondary: #b0b0b0;
  --border-color: #333333;
  --success-color: #2ecc71;
  --error-color: #e74c3c;
  --warning-color: #f39c12;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Roboto', sans-serif;
  background-color: var(--dark-bg);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 1000px;
  margin: 0 auto;
}

/* Başlık */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border-color);
}

.header h1 {
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  color: var(--text-primary);
  font-size: 28px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.header h1 i {
  color: var(--primary-color);
}

.subtitle {
  color: var(--text-secondary);
  font-size: 16px;
  margin-top: 5px;
}

.logo {
  background-color: var(--primary-color);
  color: white;
  padding: 12px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Kart Stilleri */
.card {
  background-color: var(--card-bg);
  border-radius: 12px;
  padding: 25px;
  margin-bottom: 25px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25);
}

.card-title {
  font-family: 'Poppins', sans-serif;
  font-weight: 500;
  font-size: 20px;
  margin-bottom: 20px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 10px;
}

.card-title i {
  color: var(--primary-color);
}

/* Form Stilleri */
.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
  margin-bottom: 20px;
}

.input-group {
  display: flex;
  flex-direction: column;
  margin-bottom: 20px;
}

.input-group label {
  font-weight: 500;
  margin-bottom: 8px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.input-group input, .input-group select {
  padding: 14px 16px;
  background-color: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  color: var(--text-primary);
  font-size: 16px;
  transition: all 0.3s ease;
}

.input-group input:focus, .input-group select:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
}

.input-group input:hover, .input-group select:hover {
  border-color: #444;
}

/* Kademe Stilleri */
.tier {
  background-color: rgba(255, 255, 255, 0.03);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 15px;
  border: 1px solid var(--border-color);
  transition: background-color 0.3s ease;
}

.tier:hover {
  background-color: rgba(255, 255, 255, 0.05);
}

.tier-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-color);
}

.tier-number {
  font-weight: 500;
  color: var(--primary-color);
  font-size: 16px;
}

.tier-inputs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
}

.btn-remove-tier {
  background-color: rgba(231, 76, 60, 0.2);
  color: var(--error-color);
  border: none;
  border-radius: 6px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-remove-tier:hover {
  background-color: rgba(231, 76, 60, 0.3);
}

/* Butonlar */
.buttons-container {
  display: flex;
  gap: 15px;
  margin-top: 30px;
  flex-wrap: wrap;
}

.btn {
  padding: 14px 28px;
  border: none;
  border-radius: 8px;
  font-weight: 500;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all 0.3s ease;
}

.btn-primary {
  background-color: var(--primary-color);
  color: white;
}

.btn-primary:hover {
  background-color: var(--primary-dark);
  transform: translateY(-2px);
}

.btn-secondary {
  background-color: rgba(255, 255, 255, 0.1);
  color: var(--text-primary);
  border: 1px solid var(--border-color);
}

.btn-secondary:hover {
  background-color: rgba(255, 255, 255, 0.15);
  transform: translateY(-2px);
}

.btn-success {
  background-color: var(--secondary-color);
  color: white;
}

.btn-success:hover {
  background-color: var(--secondary-dark);
  transform: translateY(-2px);
}

/* Bildirim */
.notification {
  position: fixed;
  top: 25px;
  right: 25px;
  background-color: var(--card-bg);
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-width: 320px;
  max-width: 400px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
  z-index: 1000;
  animation: slideIn 0.3s ease forwards;
}

.notification-success {
  border-left-color: var(--success-color);
}

.notification-error {
  border-left-color: var(--error-color);
}

.notification-content {
  display: flex;
  align-items: center;
  gap: 12px;
}

.notification i {
  font-size: 20px;
}

.notification-success i {
  color: var(--success-color);
}

.notification-error i {
  color: var(--error-color);
}

.notification-close {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 16px;
  transition: color 0.3s ease;
}

.notification-close:hover {
  color: var(--text-primary);
}

@keyframes slideIn {
  from {
    transform: translateX(100%);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

/* Footer */
.footer {
  text-align: center;
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid var(--border-color);
  color: var(--text-secondary);
  font-size: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
}

.footer-info {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Responsive Tasarım */
@media (max-width: 768px) {
  .form-row {
    grid-template-columns: 1fr;
  }
  
  .tier-inputs {
    grid-template-columns: 1fr;
  }
  
  .header {
    flex-direction: column;
    gap: 15px;
    align-items: flex-start;
  }
  
  .notification {
    left: 20px;
    right: 20px;
    min-width: auto;
    max-width: 100%;
  }
  
  .buttons-container {
    flex-direction: column;
  }
  
  .btn {
    width: 100%;
  }
  
  .footer {
    flex-direction: column;
    gap: 15px;
    align-items: center;
  }
}
</style>
</head>
<body>
<div class="container">
  <!-- Başlık -->
  <div class="header">
    <div>
      <h1><i class="fas fa-copy"></i> Büro Copy Yönetim Paneli</h1>
      <p class="subtitle">Ürün ve fiyat kademelerini yönetin</p>
    </div>
    <div class="logo">
      <i class="fas fa-building"></i> BÜRO COPY
    </div>
  </div>
  
  <!-- Ana Kart -->
  <div class="card">
    <h2 class="card-title"><i class="fas fa-plus-circle"></i> Yeni Ürün Ekle</h2>
    
    <!-- Ürün Bilgileri -->
    <div class="form-row">
      <div class="input-group">
        <label for="code"><i class="fas fa-barcode"></i> Ürün Kodu*</label>
        <input type="text" id="code" placeholder="örn: BC-001">
      </div>
      
      <div class="input-group">
        <label for="name"><i class="fas fa-box"></i> Ürün Adı*</label>
        <input type="text" id="name" placeholder="örn: A4 Fotokopi Kağıdı">
      </div>
      
      <div class="input-group">
        <label for="unit"><i class="fas fa-ruler"></i> Birim*</label>
        <select id="unit">
          <option value="adet">Adet</option>
          <option value="m">Metre</option>
          <option value="m2">m²</option>
          <option value="kg">Kilogram</option>
          <option value="paket">Paket</option>
          <option value="top">Top</option>
        </select>
      </div>
    </div>
    
    <!-- Fiyat Kademeleri -->
    <h3 class="card-title"><i class="fas fa-layer-group"></i> Fiyat Kademeleri</h3>
    <div id="tiers"></div>
    
    <!-- Butonlar -->
    <div class="buttons-container">
      <button class="btn btn-secondary" onclick="addTier()">
        <i class="fas fa-plus"></i> Yeni Kademe Ekle
      </button>
      <button class="btn btn-success" onclick="saveProduct()">
        <i class="fas fa-save"></i> Ürünü Kaydet
      </button>
    </div>
  </div>
  
  <!-- Footer -->
  <div class="footer">
    <div class="footer-info">
      <i class="fas fa-info-circle"></i>
      <span>* ile işaretli alanlar zorunludur</span>
    </div>
    <div>© 2023 Büro Copy Yönetim Paneli</div>
    <div class="footer-info">
      <i class="fas fa-database"></i>
      <span>Firebase ile entegre</span>
    </div>
  </div>
</div>

<script>
// Sayfa yüklendiğinde bir kademe ekle
document.addEventListener('DOMContentLoaded', function() {
  addTier();
});
</script>
</body>
</html>
